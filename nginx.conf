# ===== 限流区 =====
limit_req_zone $binary_remote_addr zone=sourcely_api:10m rate=10r/s;

# ===== upstream 连接池 =====
upstream sourcely_backend {
    server 127.0.0.1:8008;
    keepalive 32;
}

# ===== HTTP（80）— 暂时直接提供服务 =====
server {
    server_name sourcely1688.com www.sourcely1688.com;

    # certbot ACME 域名验证
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ==================== 基础限制 ====================
    client_max_body_size 10m;

    # ==================== 静态资源 ====================
    location /static/ {
        root /opt/sourcely/src/web;
        expires 7d;
        add_header Cache-Control "public, immutable";
        gzip on;
        gzip_vary on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_min_length 500;
    }

    location /lang/ {
        root /opt/sourcely/src/web;
        expires 1d;
        add_header Cache-Control "public";
    }

    # ==================== 图片代理 ====================
    location /api/proxy/image {
        proxy_pass http://sourcely_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================== API ====================
    location /api/ {
        proxy_pass http://sourcely_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        limit_req zone=sourcely_api burst=20 nodelay;
        limit_req_status 429;
    }

    # ==================== 主应用 ====================
    location / {
        proxy_pass http://sourcely_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sourcely1688.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sourcely1688.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.sourcely1688.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = sourcely1688.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name sourcely1688.com www.sourcely1688.com;
    return 404; # managed by Certbot
}