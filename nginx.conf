# ============================================================
# Sourcely — 生产 Nginx 配置 (完整版)
# FastAPI reverse proxy + HTTPS + rate limit + keepalive + gzip
#
# === 部署步骤 ===
# 1. 先注释掉 443 server block（ssl_certificate 路径还不存在）
# 2. cp nginx.conf /etc/nginx/sites-available/sourcely
#    ln -sf /etc/nginx/sites-available/sourcely /etc/nginx/sites-enabled/
#    rm -f /etc/nginx/sites-enabled/default
# 3. nginx -t && systemctl reload nginx
# 4. certbot --nginx -d sourcely1688.com -d www.sourcely1688.com
#    → certbot 自动写入 SSL 证书路径 + 创建 443 server block
# 5. 用本文件覆盖 certbot 生成的版本（补回 upstream / limit_req / gzip 等自定义配置）
#    nginx -t && systemctl reload nginx
# ============================================================

# ===== 限流区 =====
limit_req_zone $binary_remote_addr zone=sourcely_api:10m rate=10r/s;

# ===== upstream 连接池（减少 TCP 握手，每次请求省 ~5ms） =====
upstream sourcely_backend {
    server 127.0.0.1:8008;
    keepalive 32;
}

# ===== HTTP（80）— certbot 验证 + 重定向到 HTTPS =====
server {
    listen 80;
    server_name sourcely1688.com www.sourcely1688.com;

    # certbot ACME 域名验证
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余全部 301 到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== HTTPS（443） =====
server {
    listen 443 ssl http2;
    server_name sourcely1688.com www.sourcely1688.com;

    # ==================== SSL ====================
    ssl_certificate     /etc/letsencrypt/live/sourcely1688.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sourcely1688.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ==================== 安全头 ====================
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ==================== 日志 ====================
    access_log /var/log/nginx/sourcely_access.log;
    error_log  /var/log/nginx/sourcely_error.log;

    # ==================== 基础限制 ====================
    client_max_body_size 10m;

    # ==================== 静态资源 — Nginx 直接读文件，不走 uvicorn ====================
    location /static/ {
        root /opt/sourcely/src/web;
        expires 7d;
        add_header Cache-Control "public, immutable";

        gzip on;
        gzip_vary on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_min_length 500;
    }

    location /lang/ {
        root /opt/sourcely/src/web;
        expires 1d;
        add_header Cache-Control "public";
    }

    # ==================== 图片代理 — 不缓冲，快速流式返回 ====================
    location /api/proxy/image {
        proxy_pass http://sourcely_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================== API — 限流保护（10 req/s，突发 20） ====================
    location /api/ {
        proxy_pass http://sourcely_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # Apify 最长等 90s

        # proxy buffer
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # 限流
        limit_req zone=sourcely_api burst=20 nodelay;
        limit_req_status 429;
    }

    # ==================== 主应用 — 页面 + 其他 ====================
    location / {
        proxy_pass http://sourcely_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
