<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sourcely 管理后台</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6f8; color: #222; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; }
  #login { max-width: 320px; margin: 80px auto; background: #fff; padding: 28px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  #login h2 { margin: 0 0 16px; font-size: 18px; }
  input, select, button { font-size: 14px; padding: 8px 10px; border: 1px solid #d0d3d9; border-radius: 6px; box-sizing: border-box; }
  #login input { width: 100%; margin-bottom: 10px; }
  button { cursor: pointer; background: #2563eb; color: #fff; border: none; }
  button:hover { opacity: .9; }
  #main { display: none; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; box-shadow: 0 1px 4px rgba(0,0,0,.1); border-radius: 8px; overflow: hidden; }
  th, td { padding: 10px 8px; border-bottom: 1px solid #eee; text-align: left; white-space: nowrap; }
  th { background: #fafafa; font-weight: 600; }
  .tier-paid { color: #16a34a; font-weight: 600; }
  .tier-free { color: #888; }
  .op { display: flex; gap: 6px; align-items: center; }
  .op select { padding: 6px; }
  .op button { padding: 6px 10px; }
  .btn-ghost { background: #e5e7eb; color: #333; }
  #msg { margin-bottom: 12px; padding: 10px 12px; border-radius: 6px; display: none; }
  #msg.ok { background: #dcfce7; color: #166534; display: block; }
  #msg.err { background: #fee2e2; color: #991b1b; display: block; }
  .empty { padding: 30px; text-align: center; color: #999; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sourcely 管理后台</h1>

  <div id="login">
    <h2>管理员登录</h2>
    <input id="username" placeholder="用户名" autocomplete="username">
    <input id="password" type="password" placeholder="密码" autocomplete="current-password">
    <button id="btnLogin" style="width:100%">登录</button>
  </div>

  <div id="main">
    <div id="msg"></div>
    <div class="toolbar">
      <button id="btnRefresh" class="btn-ghost">刷新列表</button>
      <button id="btnLogout" class="btn-ghost">退出登录</button>
    </div>
    <div id="tableWrap"></div>
  </div>
</div>

<script>
(function () {
  var TOKEN_KEY = 'sourcely_admin_token';
  function token() { return sessionStorage.getItem(TOKEN_KEY) || ''; }
  function showMsg(text, ok) {
    var m = document.getElementById('msg');
    m.className = ok ? 'ok' : 'err';
    m.textContent = text;
  }
  function clearMsg() { document.getElementById('msg').className = ''; }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    var t = token();
    if (t) opts.headers.Authorization = 'Bearer ' + t;
    return fetch(path, opts).then(function (r) {
      if (r.status === 401) { sessionStorage.removeItem(TOKEN_KEY); showLogin(); throw new Error('登录已过期'); }
      return r.json();
    });
  }

  function showLogin() {
    document.getElementById('login').style.display = 'block';
    document.getElementById('main').style.display = 'none';
  }
  function showMain() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    loadUsers();
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtDT(s) { return s ? String(s).replace('T', ' ').slice(0, 16) : '-'; }

  function loadUsers() {
    clearMsg();
    api('/api/admin/users').then(function (r) {
      if (r.code !== 200) { showMsg(r.message || '加载失败', false); return; }
      renderTable(r.data.users || []);
    }).catch(function (e) {
      if (e.message !== '登录已过期') showMsg('加载失败: ' + e.message, false);
    });
  }

  function renderTable(users) {
    var wrap = document.getElementById('tableWrap');
    if (!users.length) { wrap.innerHTML = '<div class="empty">暂无用户</div>'; return; }
    var html = '<table><thead><tr>' +
      '<th>ID</th><th>邮箱</th><th>姓名</th><th>语言</th><th>会员</th><th>配额</th>' +
      '<th>注册时间</th><th>最后登录</th><th>操作</th></tr></thead><tbody>';
    users.forEach(function (u) {
      var paid = u.tier === 'paid';
      html += '<tr>' +
        '<td>' + esc(u.id) + '</td>' +
        '<td>' + esc(u.email) + '</td>' +
        '<td>' + esc(u.name) + '</td>' +
        '<td>' + esc(u.default_lang) + '</td>' +
        '<td class="' + (paid ? 'tier-paid' : 'tier-free') + '">' + (paid ? '付费' : '免费') + '</td>' +
        '<td>' + esc(u.quota) + '</td>' +
        '<td>' + fmtDT(u.created_at) + '</td>' +
        '<td>' + fmtDT(u.last_login) + '</td>' +
        '<td><div class="op">' +
        '<button data-act="tier" data-id="' + esc(u.id) + '" class="btn-ghost">' + (paid ? '降为免费' : '升为付费') + '</button>' +
        '<select data-act="amt"><option value="300">+300</option><option value="500">+500</option><option value="1000">+1000</option></select>' +
        '<button data-act="quota" data-id="' + esc(u.id) + '">加配额</button>' +
        '</div></td></tr>';
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    var uid = btn.getAttribute('data-id');
    if (act === 'tier') {
      api('/api/admin/users/' + uid + '/tier', { method: 'POST', body: '{}' }).then(function (r) {
        if (r.code === 200) { showMsg('已切换会员，当前: ' + r.data.tier, true); loadUsers(); }
        else showMsg(r.message || '操作失败', false);
      }).catch(function () {});
    } else if (act === 'quota') {
      var sel = btn.parentElement.querySelector('select[data-act=amt]');
      api('/api/admin/users/' + uid + '/quota', { method: 'POST', body: JSON.stringify({ amount: Number(sel.value) }) }).then(function (r) {
        if (r.code === 200) { showMsg('已加配额，当前: ' + r.data.quota, true); loadUsers(); }
        else showMsg(r.message || '操作失败', false);
      }).catch(function () {});
    }
  });

  document.getElementById('btnLogin').addEventListener('click', function () {
    var u = document.getElementById('username').value.trim();
    var p = document.getElementById('password').value;
    if (!u || !p) { showMsg('请输入用户名和密码', false); return; }
    fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    }).then(function (r) { return r.json(); }).then(function (r) {
      if (r.code === 200 && r.data && r.data.token) {
        sessionStorage.setItem(TOKEN_KEY, r.data.token);
        showMain();
      } else {
        showMsg(r.message || '登录失败', false);
      }
    }).catch(function () { showMsg('网络错误', false); });
  });

  document.getElementById('btnRefresh').addEventListener('click', loadUsers);
  document.getElementById('btnLogout').addEventListener('click', function () {
    sessionStorage.removeItem(TOKEN_KEY); showLogin();
  });

  if (token()) { showMain(); } else { showLogin(); }
})();
</script>
</body>
</html>
